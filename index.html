<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#f5f6fa" id="theme-color-meta" />
  <title>PIF/FIP Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <span class="paw-dot paw-dot-1"></span><span class="paw-dot paw-dot-2"></span><span class="paw-dot paw-dot-3"></span><span class="paw-dot paw-dot-4"></span><span class="paw-pad"></span>
      </div>
      <div class="brand-copy">
        <span class="brand-kicker">PIF · FIP</span>
        <h1 data-translate="calcTitle">PIF Tracker</h1>
      </div>
    </div>
    <div class="header-controls">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.3 15.2A8.4 8.4 0 0 1 8.8 3.7a8.4 8.4 0 1 0 11.5 11.5Z"></path>
        </svg>
      </button>
      <label class="language-control" aria-label="Language">
            <select id="languageSelect">
          <option value="es">ES</option>
          <option value="en">EN</option>
        </select>
      </label>
    </div>
  </header>

  <nav id="tabs" aria-label="Principal">
    <button class="tab-btn" data-tab="calc" data-translate="tabCalc">Calculadora</button>
    <button class="tab-btn" data-tab="registro" data-translate="tabRegistro">Registro</button>
    <button class="tab-btn" data-tab="seguimiento" data-translate="tabSeguimiento">Seguimiento</button>
  </nav>

  <main>
    <section id="calc-section" class="screen-section">
      <div class="section-heading">
        <div>
          <span class="eyebrow">PIF Tracker</span>
          <h2 data-translate="formAdmin">Forma de administración:</h2>
        </div>
      </div>

      <div class="content-card calculator-card">
        <form id="calc-form">
          <div class="field-group">
            <label for="calc-forma" data-translate="formAdmin"></label>
            <select id="calc-forma">
              <option value="inyectable" data-translate="inyectable"></option>
              <option value="pastillas" data-translate="pastillas"></option>
              <option value="oral" data-translate="oral"></option>
              <option value="custom" data-translate="custom"></option>
            </select>
          </div>

          <div id="tipo-container" class="field-group">
            <label for="calc-tipo" data-translate="tipoPIF"></label>
            <select id="calc-tipo"></select>
          </div>

          <div id="concentracion-container" class="field-group"></div>

          <div id="custom-fields" class="custom-panel" style="display:none;">
            <div class="field-group">
              <label data-translate="subformaLabel"></label>
              <select id="custom-subforma">
                <option value="inyectable" data-translate="inyectable"></option>
                <option value="pastillas" data-translate="pastillas"></option>
                <option value="oral" data-translate="oral"></option>
              </select>
            </div>
            <div class="field-group">
              <label id="label-concentration" data-translate="customConcentration"></label>
              <input type="number" id="custom-concentration" step="0.1" inputmode="decimal" />
            </div>
            <div class="field-group">
              <label data-translate="customDosage"></label>
              <input type="number" id="custom-dosage" step="0.1" inputmode="decimal" />
            </div>
          </div>

          <div class="field-group weight-field">
            <label for="calc-peso" data-translate="pesoGato"></label>
            <div class="input-with-unit">
              <input type="number" id="calc-peso" step="0.1" inputmode="decimal" />
              <span>kg</span>
            </div>
          </div>

          <button id="btn-calcular" class="primary-action" type="submit" data-translate="btnCalcular"></button>
        </form>
      </div>

      <div id="calc-resultado" class="result-card" aria-live="polite"></div>
      <div class="warning-card">
        <span class="warning-icon" aria-hidden="true">i</span>
        <span class="advertencia" data-translate="advertencia"></span>
      </div>
    </section>

    <section id="registro-section" class="screen-section" style="display:none;">
      <div class="section-heading"><div><span class="eyebrow">PIF Tracker</span><h2 data-translate="historialTitle"></h2></div><div class="section-icon" aria-hidden="true">✎</div></div>
      <div class="content-card">
        <form id="registro-form">
          <div class="field-group"><label for="registro-dia" data-translate="registroDia"></label><input type="date" id="registro-dia" /></div>
          <div class="field-group"><label for="registro-peso" data-translate="registroPeso"></label><input type="number" id="registro-peso" step="0.1" inputmode="decimal"/></div>
          <div class="field-group"><label for="registro-dosis" data-translate="registroDosis"></label><input type="text" id="registro-dosis" /></div>
          <div class="field-group"><label for="registro-comentarios" data-translate="registroComentarios"></label><textarea id="registro-comentarios" rows="3"></textarea></div>
          <button id="btn-guardar" class="primary-action" type="submit" data-translate="btnGuardar"></button>
        </form>
      </div>
      <div id="historial"></div>
    </section>

    <section id="seguimiento-section" class="screen-section" style="display:none;">
      <div class="section-heading"><div><span class="eyebrow">84 + 84</span><h2 data-translate="seguimientoTitle">Seguimiento</h2></div><div class="section-icon" aria-hidden="true">✓</div></div>
      <div class="content-card tracking-card">
        <div class="seg-row">
          <div class="field-group"><label>Inicio tratamiento</label><input type="date" id="treat-start" /></div>
          <div class="field-group"><label>Inicio observación</label><input type="date" id="obs-start" /></div>
        </div>
        <div class="seg-stats">
          <div><span data-translate="treat">Tratamiento</span> / <span data-translate="obs">Observación</span><strong id="phase-now">—</strong></div>
          <div><span>Día de la fase</span><strong><span id="day-in-phase">—</span> / 84</strong></div>
          <div><span>Día total</span><strong><span id="day-global">—</span> / 168</strong></div>
        </div>
        <div class="seg-progress"><div class="seg-bar"><div id="progress-fill" style="width:0%"></div></div><small id="progress-label">0%</small></div>
        <div class="seg-actions">
          <button id="mark-today" data-translate="markToday">Marcar dosis de hoy ✔</button>
          <button id="add-note-today" data-translate="addNote">Agregar nota</button>
          <button id="gen-days" data-translate="regenList">Regenerar lista</button>
        </div>
      </div>
      <div id="seguimiento-list" class="seg-list"></div>
    </section>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
